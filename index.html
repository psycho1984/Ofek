function landing(){return `<section class="landing"><div class="landing-top"><div class="mini-brand"><img src="ofek-logo.png" alt="לוגו מוצע אופק שירות ותחזוקה"><div><b>אופק שירות ותחזוקה</b><small>מערכת שירות דיגיטלית לציוד גריסה וניפוי</small></div></div><span class="outline-tag">גרסת הדגמה · OFEK SERVICE</span></div><div class="landing-main"><div class="landing-copy"><div class="eyebrow">OFEK · SERVICE & MAINTENANCE</div><h1>כשהציוד עובד,<br><em>העבודה מתקדמת.</em></h1><p>אופק שירות ותחזוקה מעניקה שירות שטח, אבחון תקלות, תיקונים וטיפולים תקופתיים לנפות ולמגרסות של מגוון יצרנים — לא רק לציוד שנמכר באמצעות אופק בנטל.</p><button class="btn cta" onclick="page='login';render()">כניסה למערכת השירות ←</button><div class="landing-features"><span>◈ קריאות שירות</span><span>◈ תיאום טכנאים</span><span>◈ דוחות טיפול</span></div></div><div class="landing-image"><img src="ofek-logo.png" alt="קונספט מיתוג אופק"><div class="landing-image-caption">שירות מקצועי לציוד גריסה וניפוי · מגוון יצרנים</div></div></div><div class="landing-about"><div><strong>שירות ותחזוקה בשטח</strong><p>קריאות שירות, אבחון, תיקונים וטיפולים תקופתיים במערכות גריסה וניפוי ממגוון יצרנים.</p></div><div><strong>הלקוח במרכז</strong><p>פתיחת קריאה, תיאום מועד, מעקב אחר ביצוע, תיעוד טיפולים ודוחות דיגיטליים.</p></div><div><strong>ניהול עבודה מסודר</strong><p>יומן חודשי משותף למנהלים, שיבוץ טכנאים, תיעוד העבודה ומעקב מזכירות.</p></div></div><div class="sales-banner"><div><span class="sales-kicker">חברה נפרדת · תחום מכירת ציוד</span><h2>מעוניינים בציוד חדש?</h2><p><b>אופק בנטל</b> פועלת בנפרד בתחום מכירת נפות ומכולות של <b>Keestrack</b>. לקבלת מידע על רכישת ציוד חדש, ניתן לפנות לנציגי אופק בנטל.</p><p class="small">פעילות המכירות נפרדת ממערכת השירות. אין צורך להיות לקוח של אופק בנטל כדי לקבל שירות מאופק שירות ותחזוקה.</p></div><div class="sales-symbol">KEESTRACK<span>ציוד חדש · בירור מכירה</span></div></div><div class="demo-disclaimer">אתר הדגמה בלבד · לקוחות ופרטי שירות פיקטיביים · הלוגו הוא הצעת מיתוג ולא לוגו ר function ticketList(items,actions=''){return items.length?items.map(t=>'<div class="item"><div class="row"><b>#'+t.id+' · '+esc(t.machine)+'</b>'+pill(t.status)+'</div><div class="small muted">'+esc(t.customer)+' · '+esc(t.site)+'</div><p>'+esc(t.issue)+'</p>'+(t.urgent?'<span class="pill red">מכונה מושבתת</span> ':'')+'<button class="btn alt" onclick="focusTicket='+t.id+';render()">פתיחת הקריאה</button></div>').join(''):'<p class="muted">אין קריאות להצגה.</p>'}function customer(){const own=db.tickets.filter(x=>x.customer==='מחצבות השרון (דוגמה)');let t=own.find(x=>x.id===focusTicket)||own[0];return '<div class="grid"><div class="card stat">קריאות פעילות<strong>'+own.filter(x=>!['closed','billing'].includes(x.status)).length+'</strong></div><div class="card stat">ממתינות לתיאום<strong>'+own.filter(x=>x.status==='new').length+'</strong></div><div class="card stat">ביקורים מאושרים<strong>'+own.filter(x=>x.status==='scheduled').length+'</strong></div><div class="card stat">מכונות משויכות<strong>2</strong></div></div><div class="section"><div><div class="card"><h2>פתיחת קריאת שירות</h2><form onsubmit="createTicket(event)"><label>לקוח</label><select name="customer"><option>מחצבות השרון (דוגמה)</option></select><label>מכונה</label><select name="machine"><option>Keestrack P3</option><option>Keestrack R6</option></select><label>אתר עבודה</label><input name="site" value="אתר השרון" required><label>תיאור התקלה</label><textarea name="issue" required placeholder="מה התקלה? מה כבר נבדק?"></textarea><label><input type="checkbox" name="urgent" style="width:auto"> המכונה מושבתת</label><label>שעות מנוע (אם ידוע)</label><input name="hours" type="number" min="0" placeholder="לא חובה"><button class="btn">שליחת קריאת שירות</button></form></div><div class="card"><h2>קריאות השירות שלי — הדגמה</h2>'+ticketList(own)+'</div></div><div>'+ticketDetail(t,'customer')+'</div></div>'}function createTicket(e){e.preventDefault();const f=new FormData(e.target);const t={id:db.nextId++,customer:f.get('customer'),machine:f.get('machine'),site:f.get('site'),phone:'',issue:f.get('issue'),urgent:!!f.get('urgent'),status:'new',hours:f.get('hours')||'',photos:[],notes:'',parts:'',labor:'',travel:'',signature:false,approved:false,coord:'',created:fmt(new Date())};db.tickets.unshift(t);focusTicket=t.id;log('הלקוח פתח קריאה #'+t.id);note('קריאה #'+t.id+' נפתחה ונשלחה למנהל.','success');save()}function customerConfirm(id,yes){let t=ticket(id);if(!t||t.customer!=='מחצבות השרון (דוגמה)'||t.status!=='proposed')return;if(yes){t.status='scheduled';t.approved=true;log('הלקוח אישר ביקור לקריאה #'+id);note('הביקור אושר.','success')}else{t.status='new';db.bookings=db.bookings.filter(b=>b.ticket!==id);log('הלקוח ביקש שינוי מועד לקריאה #'+id);note('בקשת שינוי המועד נשלחה למנהל.','success')}save()}function manager(){const active=db.tickets.filter(t=>!['closed','billing'].includes(t.status));return '<div class="grid"><div class="card stat">קריאות פתוחות<strong>'+active.length+'</strong></div><div class="card stat">ממתינות לשיבוץ<strong>'+db.tickets.filter(t=>t.status==='new').length+'</strong></div><div class="card stat">ביקורים ביומן<strong>'+db.bookings.length+'</strong></div><div class="card stat">ממתינות לדוח<strong>'+db.tickets.filter(t=>['done','review'].includes(t.status)).length+'</strong></div></div><div class="section"><div><div class="card"><h2>📅 יומן שיבוצים משותף</h2>'+calendar()+'</div><div class="card"><h2>שיבוץ קריאת שירות</h2><form onsubmit="assign(event)"><div class="two"><div><label>קריאה</label><select name="ticket" required>'+db.tickets.filter(t=>!['billing','closed'].includes(t.status)).map(t=>'<option value="'+t.id+'" '+(focusTicket===t.id?'selected':'')+'>#'+t.id+' — '+esc(t.machine)+'</option>').join('')+'</select></div><div><label>טכנאי</label><select name="tech"><option value="1">טכנאי 1 (כחול)</option><option value="2">טכנאי 2 (סגול)</option></select></div></div><div class="two"><div><label>תאריך</label><input name="date" type="date" value="'+selected+'" required></div><div><label>שעת התחלה</label><input name="start" type="time" value="08:00" required></div></div><div class="two"><div><label>שעת סיום</label><input name="end" type="time" value="16:00" required></div><div><label>אופן תיאום</label><select name="coord"><option value="phone">תואם טלפונית</option><option value="portal">ממתין לאישור לקוח במערכת</option></select></div></div><label><input name="allDay" type="checkbox" style="width:auto"> יום עבודה מלא (08:00–17:00)</label><button class="btn">בדיקה ושמירת שיבוץ</button><p class="filehint">ימי עבודה רגילים: ראשון–חמישי. שישי ושבת חסומים. חגי ישראל והיעדרויות יתחברו בשלב הבא.</p></form></div></div><div><div class="card"><h2>☎ פתיחת קריאה במהלך שיחת טלפון</h2><p class="muted small">המנהל יכול לפתוח קריאה בשם הלקוח ואז לשבץ אותה ביומן.</p><form onsubmit="createTicket(event)"><div class="two"><div><label>לקוח</label><select name="customer"><option>מחצבות השרון (דוגמה)</option><option>תשתיות המרכז (דוגמה)</option></select></div><div><label>מכונה</label><select name="machine"><option>Keestrack P3</option><option>Keestrack R6</option><option>Keestrack C7</option><option>Powerscreen 1400</option><option>McCloskey S190</option><option>Kleemann MR 130i EVO2</option></select></div></div><label>אתר עבודה</label><input name="site" placeholder="שם האתר / מיקום" required><label>תיאור התקלה</label><textarea name="issue" placeholder="תיאור קצר מהלקוח" required></textarea><label><input type="checkbox" name="urgent" style="width:auto"> מכונה מושבתת / דחוף</label><input name="hours" type="number" min="0" placeholder="שעות מנוע (לא חובה)"><button class="btn">פתיחת קריאה ושיבוץ בהמשך</button></form></div><div class="card"><h2>קריאות שירות</h2>'+ticketList(db.tickets)+'</div>'+ticketDetail(ticket(focusTicket)||db.tickets[0],'manager')+'<div class="card"><h3>יומן פעולות</h3>'+(db.log.slice(0,6).map(l=>'<div class="item small">'+esc(l.time)+' — '+esc(l.text)+'</div>').join('')||'<p class="muted">עדיין אין פעולות.</p>')+'</div></div></div>'}function calendar(){let y=month.getFullYear(),m=month.getMonth(),n=new Date(y,m+1,0).getDate(),offset=new Date(y,m,1).getDay();let out='<div class="row"><button class="btn alt" onclick="changeMonth(-1)">❯ הקודם</button><b>'+new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}).format(month)+'</b><button class="btn alt" onclick="changeMonth(1)">הבא ❮</button></div><label>תצוגה</label><select onchange="filter=this.value;render()"><option value="all" '+(filter==='all'?'selected':'')+'>שני הטכנאים</option><option value="1" '+(filter==='1'?'selected':'')+'>טכנאי 1</option><option value="2" '+(filter==='2'?'selected':'')+'>טכנאי 2</option></select><div class="calendar">';['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'].forEach(d=>out+='<div class="weekday">'+d+'</div>');for(let i=0;i<offset;i++)out+='<div class="day empty"></div>';for(let d=1;d<=n;d++){let dt=fmt(new Date(y,m,d)),wd=new Date(y,m,d).getDay(),off=wd===5||wd===6,arr=db.bookings.filter(b=>b.date===dt);out+='<div class="day '+(off?'off ':'')+(dt===selected?'selected':'')+'" onclick="selectDate(\''+dt+'\')"><b>'+d+'</b><div class="bars">';for(let tech of [1,2])if(filter==='all'||filter===String(tech)){let bs=arr.filter(b=>b.tech===tech);out+='<div class="bar '+(bs.length?'tech'+tech:'')+'" style="'+(!bs.length?'background:#dce5e9':'')+'" title="טכנאי '+tech+': '+(bs.length?bs.length+' עבודות':'פנוי')+'"></div>'}out+='</div></div>'}out+='</div><div class="legend"><span style="--c:#3284b9">טכנאי 1</span><span style="--c:#a568bb">טכנאי 2</span><span style="--c:#dce5e9">פנוי</span></div><h3 style="margin-top:18px">'+selected+' — שיבוצים</h3>';let bs=db.bookings.filter(b=>b.date===selected&&(filter==='all'||String(b.tech)===filter));out+=bs.length?bs.map(b=>'<div class="item"><b>טכנאי '+b.tech+' · '+b.start+'–'+b.end+'</b><div>'+esc(b.title)+'</div>'+(b.ticket?'<span class="small">קריאה #'+b.ticket+'</span>':'')+(role==='manager'?' <button class="btn alt" onclick="removeBooking('+b.id+')">ביטול שיבוץ</button>':'')+'</div>').join(''):'<p class="muted">אין שיבוצים ליום זה.</p>';return out}function changeMonth(delta){month=new Date(month.getFullYear(),month.getMonth()+delta,1);selected=fmt(month);render()}function selectDate(d){selected=d;render()}function assign(e){e.preventDefault();const f=new FormData(e.target),id=Number(f.get('ticket')),tech=Number(f.get('tech')),date=f.get('date');let start=f.get('allDay')?'08:00':f.get('start'),end=f.get('allDay')?'17:00':f.get('end');const wd=new Date(date+'T12:00:00').getDay();if(wd===5||wd===6){note('לא ניתן לשבץ ביום שישי או שבת במסגרת ימי העבודה הרגילים.','error');render();return}if(end<=start){note('שעת הסיום חייבת להיות אחרי שעת ההתחלה.','error');render();return}if(db.bookings.some(b=>b.date===date&&b.tech===tech&&start<b.end&&end>b.start&&b.ticket!==id)){note('התנגשות ביומן: הטכנאי כבר משובץ לשעות האלו.','error');render();return}const t=ticket(id);if(!t)return;db.bookings=db.bookings.filter(b=>b.ticket!==id);db.bookings.push({id:Date.now(),ticket:id,tech,date,start,end,allDay:!!f.get('allDay'),title:t.customer+' — '+t.machine});t.coord=f.get('coord');t.status=t.coord==='phone'?'scheduled':'proposed';t.approved=t.coord==='phone';selected=date;month=new Date(date+'T12:00:00');log('המנהל שיבץ את קריאה #'+id+' לטכנאי '+tech+' ביום '+date+' ('+(t.coord==='phone'?'תואם טלפונית':'ממתין לאישור לקוח')+')');note('השיבוץ נשמר ביומן. '+(t.coord==='phone'?'תואם טלפונית ונחשב מאושר.':'הלקוח צריך לאשר באזור האישי.'),'success');save()}function removeBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;if(b.ticket){let t=ticket(b.ticket);if(t){t.status='new';t.approved=false}}db.bookings=db.bookings.filter(x=>x.id!==id);log('שיבוץ בוטל ביומן');note('השיבוץ בוטל; הקריאה חזרה לתיאום.','success');save()}
function ticketDetail(t,forRole){if(!t)return '';let b=booking(t.id);let html='<div class="card"><h2>פרטי קריאה #'+t.id+'</h2><p>'+pill(t.status)+'</p><p><b>'+esc(t.machine)+'</b> · '+esc(t.customer)+'</p><p class="muted small">אתר: '+esc(t.site)+' · שעות מנוע: '+esc(t.hours||'לא דווח')+'</p><p>'+esc(t.issue)+'</p>'+(b?'<div class="notice">📅 '+b.date+' · '+b.start+'–'+b.end+' · טכנאי '+b.tech+'<br>'+esc(t.coord==='phone'?'תואם טלפונית':t.approved?'אושר על ידי הלקוח':'ממתין לאישור לקוח')+'</div>':'<div class="notice">טרם נקבע ביקור</div>');if(forRole==='customer'&&t.status==='proposed')html+='<div class="actions"><button class="btn" onclick="customerConfirm('+t.id+',true)">אישור ביקור</button><button class="btn alt" onclick="customerConfirm('+t.id+',false)">בקשת שינוי</button></div>';if(t.notes)html+='<p><b>עבודה:</b> '+esc(t.notes)+'</p>';if(t.parts)html+='<p><b>חלפים:</b> '+esc(t.parts)+'</p>';if(t.photos.length)html+='<p><b>תיעוד:</b> '+t.photos.map(p=>esc(p)).join(', ')+'</p>';if(forRole==='manager'&&['done','review','billing'].includes(t.status))html+='<p class="small">שעות עבודה: '+esc(t.labor)+' · נסיעה: '+esc(t.travel)+' · חתימה: '+(t.signature?'קיימת':'חסרה')+'</p>';html+='</div>';return html}function tech(){const techId=Number(activeUser?.id?.replace('tech',''))||1;const booked=db.bookings.filter(b=>b.ticket>0&&b.tech===techId);let selectedTicket=ticket(focusTicket);if(!selectedTicket||!booked.some(b=>b.ticket===selectedTicket.id)){selectedTicket=ticket(booked[0]?.ticket)}return '<div class="grid"><div class="card stat">משימות משובצות<strong>'+booked.length+'</strong></div><div class="card stat">בטיפול<strong>'+booked.filter(b=>['working','onsite','onway'].includes(ticket(b.ticket)?.status)).length+'</strong></div><div class="card stat">ממתינות לחלפים<strong>'+booked.filter(b=>ticket(b.ticket)?.status==='parts').length+'</strong></div><div class="card stat">הושלמו<strong>'+booked.filter(b=>['done','review','billing'].includes(ticket(b.ticket)?.status)).length+'</strong></div></div><div class="section"><div><div class="card"><h2>המשימות שלי — טכנאי '+techId+'</h2><p class="muted small">מוצגות רק המשימות המשובצות למשתמש זה.</p>'+booked.map(b=>{let t=ticket(b.ticket);return '<div class="item"><div class="row"><b>#'+t.id+' · '+esc(t.machine)+'</b>'+pill(t.status)+'</div><div class="small muted">טכנאי '+b.tech+' · '+b.date+' · '+b.start+'–'+b.end+'</div><p>'+esc(t.issue)+'</p><button class="btn alt" onclick="focusTicket='+t.id+';render()">פתיחת משימה</button></div>'}).join('')+'</div></div><div>'+(selectedTicket?'<div class="card"><h2>עדכון עבודה #'+selectedTicket.id+'</h2><p>'+esc(selectedTicket.machine)+' · '+esc(selectedTicket.site)+'</p><div class="actions">'+[['onway','בדרך'],['onsite','הגעתי לאתר'],['working','בטיפול'],['parts','ממתין לחלפים'],['done','העבודה הושלמה']].map(([s,l])=>'<button class="btn '+(s==='parts'?'alt':'')+'" onclick="setStatus('+selectedTicket.id+',\''+s+'\')">'+l+'</button>').join('')+'</div><form onsubmit="saveReport(event,'+selectedTicket.id+')"><label>פירוט העבודה שבוצעה</label><textarea name="notes" placeholder="מה נמצא ומה בוצע?">'+esc(selectedTicket.notes)+'</textarea><label>חלפים שהוחלפו / נדרשים</label><textarea name="parts" placeholder="שם חלק, מק״ט, כמות">'+esc(selectedTicket.parts)+'</textarea><div class="two"><div><label>שעות עבודה</label><input type="number" name="labor" step="0.25" min="0" value="'+esc(selectedTicket.labor)+'"></div><div><label>שעות נסיעה</label><input type="number" name="travel" step="0.25" min="0" value="'+esc(selectedTicket.travel)+'"></div></div><label>שעות מנוע</label><input type="number" name="hours" min="0" value="'+esc(selectedTicket.hours)+'"><label>תמונות תיעוד (בחירת קבצים)</label><input type="file" name="photos" accept="image/*" multiple><p class="filehint">באבטיפוס נשמרים שמות הקבצים בלבד; אין העלאת תמונות לשרת.</p><label><input type="checkbox" name="signature" style="width:auto" '+(selectedTicket.signature?'checked':'')+'> נציג הלקוח חתם (סימון הדגמה בלבד)</label><button class="btn">שמירת דוח עבודה</button></form></div>':'<div class="card"><h2>אין משימה משובצת</h2><p>כדי להדגים עבודת טכנאי, עבור למנהל ושבץ קריאה ביומן.</p></div>')+'</div></div>'}function setStatus(id,s){let t=ticket(id);if(!t||activeUser?.role!=='tech'||!db.bookings.some(b=>b.ticket===id&&b.tech===Number(activeUser.id.replace('tech',''))))return;t.status=s;log('הטכנאי עדכן קריאה #'+id+': '+statuses[s]);note('סטטוס הקריאה עודכן.','success');save()}function saveReport(e,id){e.preventDefault();if(activeUser?.role!=='tech'||!db.bookings.some(b=>b.ticket===id&&b.tech===Number(activeUser.id.replace('tech',''))))return;let t=ticket(id),f=new FormData(e.target);for(let k of ['notes','parts','labor','travel','hours'])t[k]=f.get(k);t.signature=!!f.get('signature');let files=e.target.querySelector('[name=photos]').files;t.photos=[...new Set([...t.photos,...[...files].map(x=>x.name)])];if(t.status==='done')t.status='review';log('הטכנאי שמר דוח עבודה לקריאה #'+id);note('דוח העבודה נשמר בהדגמה.','success');save()}function office(){return '<div class="grid"><div class="card stat">קריאות חדשות<strong>'+db.tickets.filter(t=>t.status==='new').length+'</strong></div><div class="card stat">ממתינות לאישור<strong>'+db.tickets.filter(t=>t.status==='proposed').length+'</strong></div><div class="card stat">דוחות לבדיקה<strong>'+db.tickets.filter(t=>['done','review'].includes(t.status)).length+'</strong></div><div class="card stat">מוכנות לחיוב<strong>'+db.tickets.filter(t=>t.status==='billing').length+'</strong></div></div><div class="section"><div><div class="card"><h2>קריאות שירות ומעקב</h2>'+ticketList(db.tickets)+'</div><div class="card"><h2>דוחות להשלמה ולחיוב</h2>'+db.tickets.filter(t=>['done','review','billing'].includes(t.status)).map(t=>'<div class="item"><div class="row"><b>#'+t.id+' · '+esc(t.machine)+'</b>'+pill(t.status)+'</div><p class="small">פירוט: '+(t.notes?'✓':'חסר')+' · שעות עבודה: '+(t.labor?'✓':'חסר')+' · חתימה: '+(t.signature?'✓':'חסרה')+'</p><button class="btn" '+(!t.notes||!t.labor||!t.signature||t.status==='billing'?'disabled':'')+' onclick="markBilling('+t.id+')">סימון כמוכן לחיוב</button></div>').join('')+'</div></div><div><div class="card"><h2>פתיחת קריאה טלפונית</h2><form onsubmit="createTicket(event)"><label>לקוח</label><select name="customer"><option>מחצבות השרון (דוגמה)</option><option>תשתיות המרכז (דוגמה)</option></select><label>מכונה</label><select name="machine"><option>Keestrack P3</option><option>Powerscreen 1400</option><option>McCloskey S190</option><option>Keestrack R6</option><option>Kleemann MR 130i EVO2</option><option>Metso ST3.8</option></select><label>אתר עבודה</label><input name="site" value="אתר השרון" required><label>תיאור התקלה</label><textarea name="issue" required></textarea><label><input type="checkbox" name="urgent" style="width:auto"> מכונה מושבתת</label><input name="hours" type="number" placeholder="שעות מנוע"><div class="actions"><button class="btn">פתיחת קריאה</button></div></form></div>'+ticketDetail(ticket(focusTicket)||db.tickets[0],'office')+'<div class="card"><h3>יומן שיבוצים — צפייה למזכירות</h3><p class="muted small">זמינות משותפת. שיבוץ ושינוי על ידי מנהל בלבד.</p>'+calendar()+'</div></div></div>'}function markBilling(id){let t=ticket(id);if(!t.notes||!t.labor||!t.signature)return;t.status='billing';log('המזכירות סימנה קריאה #'+id+' כמוכנה לחיוב');note('הדוח סומן כמוכן לחיוב.','success');save()}function resetDemo(){if(!confirm('לאפס את כל נתוני ההדגמה בדפדפן זה?'))return;localStorage.removeItem(KEY);location.reload()}window.addEventListener('error',e=>console.error(e.message));render();
</script><div style="text-align:center;padding:0 0 25px"><button class="btn alt" onclick="resetDemo()">איפוס נתוני ההדגמה</button></div></body></html>
