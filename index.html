:root{font-family:Arial,'Segoe UI',sans-serif;color:#183044;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#102b42;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:24px;font-weight:800}.brand small{font-size:12px;display:block;color:#bad1df;font-weight:400;margin-top:4px}.top{display:flex;gap:8px;flex-wrap:wrap}.top button{border:1px solid #547186;border-radius:9px;padding:10px 13px;background:#1d405a;color:white}.top button.active{background:#e5b353;color:#172a36;border-color:#e5b353;font-weight:700}main{max-width:1250px;margin:auto;padding:22px 16px 80px}.hero{background:linear-gradient(110deg,#183c58,#2c6a83);color:white;border-radius:16px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 9px}.muted{color:#647786}.hero .muted{color:#d1e3ed}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #dfe7ed;border-radius:14px;padding:17px;box-shadow:0 3px 15px #1a354509;margin-bottom:14px}.card h2,.card h3{margin:0 0 13px}.stat strong{font-size:28px;display:block;margin-top:7px}.section{display:grid;grid-template-columns:1.25fr 1fr;gap:15px}.btn{border:0;border-radius:9px;background:#12617d;color:white;padding:11px 15px;font-weight:700}.btn.alt{background:#e9f1f5;color:#16435b}.btn.danger{background:#a63838}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd7df;border-radius:8px;padding:10px;background:white;color:#183044}textarea{min-height:85px;resize:vertical}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{display:inline-block;background:#e6f0f5;color:#17506a;border-radius:20px;padding:5px 9px;font-size:12px}.pill.warn{background:#fff0cf;color:#805000}.pill.ok{background:#e0f4e8;color:#146a3c}.pill.red{background:#fbe3e0;color:#922b27}.item{padding:12px 0;border-bottom:1px solid #e7edf1}.item:last-child{border:0}.small{font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}.weekday{text-align:center;font-size:12px;font-weight:bold;color:#667e8c;padding:7px 0}.day{min-height:78px;background:#f7fafb;border:1px solid #e3eaee;border-radius:8px;padding:6px;text-align:right;color:#1c3b4e;cursor:pointer}.day.selected{outline:2px solid #247ca0;background:#edf7fc}.day.off{background:#eceff1;color:#81919b}.day.empty{border:0;background:transparent;cursor:default}.bars{display:grid;gap:3px;margin-top:6px}.bar{height:7px;border-radius:4px}.tech1{background:#3284b9}.tech2{background:#a568bb}.full{background:#c2574d}.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px}.legend span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-left:5px}.notice{background:#fff7df;border:1px solid #e9cc83;border-radius:10px;padding:12px;margin:12px 0}.success{background:#e8f8ed;border:1px solid #a8d6b5}.error{background:#fff0ee;border:1px solid #e4aaa5}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{width:100%;border-collapse:collapse}.table td,.table th{border-bottom:1px solid #e5ecf0;padding:10px;text-align:right;font-size:13px}.table th{background:#f2f7fa}.filehint{font-size:12px;color:#647786}.footer{text-align:center;font-size:12px;color:#647786;padding:20px}.role-link{color:#e5b353;text-decoration:underline;cursor:pointer} @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.section{grid-template-columns:1fr}}@media(max-width:560px){header{padding:14px}.brand{font-size:20px}.top button{padding:8px;font-size:12px}main{padding:12px 9px 60px}.grid{gap:7px}.card{padding:12px}.day{min-height:59px;padding:3px;font-size:12px}.calendar{gap:2px}.two{grid-template-columns:1fr}.hero{padding:18px}}
</style></head><body><header><div class="brand">⚙️ אופק <small>שירות ותחזוקה | מערכת הדגמה</small></div><nav class="top" id="nav"></nav></header><main id="app"></main><div class="footer">גרסת הדגמה מקומית • נתונים פיקטיביים • אין שימוש במידע של לקוחות אמיתיים • השינויים נשמרים בדפדפן הנוכחי בלבד</div><script>
const KEY='ofek_demo_v1';const initial={tickets:[{id:1001,customer:'מחצבות השרון (דוגמה)',machine:'Keestrack P3',site:'אתר השרון',phone:'050-000-0001',issue:'רעש חריג באזור המיסב',urgent:true,status:'new',hours:1250,photos:[],notes:'',parts:'',labor:'',travel:'',signature:false,approved:false,coord:'',created:'2026-11-10'},{id:1002,customer:'תשתיות המרכז (דוגמה)',machine:'Powerscreen 1400',site:'אתר המרכז',phone:'050-000-0002',issue:'בדיקת מסוע ראשי',urgent:false,status:'new',hours:830,photos:[],notes:'',parts:'',labor:'',travel:'',signature:false,approved:false,coord:'',created:'2026-11-10'}],bookings:[{id:1,ticket:0,tech:1,date:'2026-11-12',start:'08:00',end:'16:00',allDay:true,title:'טיפול תקופתי — הדגמה'},{id:2,ticket:0,tech:2,date:'2026-11-12',start:'08:00',end:'12:00',allDay:false,title:'בדיקת מכונה — הדגמה'}],nextId:1003,log:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=JSON.parse(JSON.stringify(initial))}let role='manager',month=new Date(2026,10,1),selected='2026-11-12',filter='all',focusTicket=1001,message='';const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const statuses={new:'ממתינה לתיאום',proposed:'מועד מוצע — ממתין ללקוח',scheduled:'ביקור מאושר',onway:'הטכנאי בדרך',onsite:'הטכנאי באתר',working:'בטיפול',parts:'ממתינה לחלפים',done:'העבודה הושלמה',review:'בבדיקת מזכירות',billing:'מוכנה לחיוב',closed:'סגורה'};const pill=(t)=>'<span class="pill '+(t==='done'||t==='billing'||t==='closed'?'ok':t==='new'||t==='proposed'?'warn':'')+'">'+(statuses[t]||t)+'</span>';function note(t,type=''){message='<div class="notice '+type+'">'+esc(t)+'</div>'}function log(t){db.log.unshift({time:new Date().toLocaleString('he-IL'),text:t});db.log=db.log.slice(0,60)}function ticket(id){return db.tickets.find(t=>t.id===Number(id))}function booking(id){return db.bookings.find(b=>b.ticket===Number(id))}function setRole(r){role=r;message='';render()}function render(){const names={customer:'לקוח',tech:'טכנאי',manager:'מנהל',office:'מזכירות'};$('nav').innerHTML=Object.entries(names).map(([k,v])=>'<button class="'+(role===k?'active':'')+'" onclick="setRole(\''+k+'\')">'+v+'</button>').join('');$('app').innerHTML='<div class="hero"><h1>'+({customer:'האזור האישי של הלקוח',tech:'משימות הטכנאי',manager:'ניהול ושיבוץ קריאות שירות',office:'ניהול משרד ושירות'}[role])+'</h1><div class="muted">מערכת אופק — גרסת הדגמה אינטראקטיבית. כל שינוי מוצג בתפקידים האחרים באותו דפדפן.</div></div>'+message+(role==='manager'?manager():role==='customer'?customer():role==='tech'?tech():office());message=''}function ticketList(items,actions=''){return items.length?items.map(t=>'<div class="item"><div class="row"><b>#'+t.id+' · '+esc(t.machine)+'</b>'+pill(t.status)+'</div><div class="small muted">'+esc(t.customer)+' · '+esc(t.site)+'</div><p>'+esc(t.issue)+'</p>'+(t.urgent?'<span class="pill red">מכונה מושבתת</span> ':'')+'<button class="btn alt" onclick="focusTicket='+t.id+';render()">פתיחת הקריאה</button></div>').join(''):'<p class="muted">אין קריאות להצגה.</p>'}function customer(){let t=ticket(focusTicket)||db.tickets[0];return '<div class="grid"><div class="card stat">קריאות פעילות<strong>'+db.tickets.filter(x=>!['closed','billing'].includes(x.status)).length+'</strong></div><div class="card stat">ממתינות לתיאום<strong>'+db.tickets.filter(x=>x.status==='new').length+'</strong></div><div class="card stat">ביקורים מאושרים<strong>'+db.tickets.filter(x=>x.status==='scheduled').length+'</strong></div><div class="card stat">מכונות לדוגמה<strong>2</strong></div></div><div class="section"><div><div class="card"><h2>פתיחת קריאת שירות</h2><form onsubmit="createTicket(event)"><label>לקוח</label><select name="customer"><option>מחצבות השרון (דוגמה)</option><option>תשתיות המרכז (דוגמה)</option></select><label>מכונה</label><select name="machine"><option>Keestrack P3</option><option>Powerscreen 1400</option><option>McCloskey S190</option><option>Keestrack R6</option></select><label>אתר עבודה</label><input name="site" value="אתר השרון" required><label>תיאור התקלה</label><textarea name="issue" required placeholder="מה התקלה? מה כבר נבדק?"></textarea><label><input type="checkbox" name="urgent" style="width:auto"> המכונה מושבתת</label><label>שעות מנוע (אם ידוע)</label><input name="hours" type="number" min="0" placeholder="לא חובה"><button class="btn">שליחת קריאת שירות</button></form></div><div class="card"><h2>קריאות השירות שלי — הדגמה</h2>'+ticketList(db.tickets)+'</div></div><div>'+ticketDetail(t,'customer')+'</div></div>'}function createTicket(e){e.preventDefault();const f=new FormData(e.target);const t={id:db.nextId++,customer:f.get('customer'),machine:f.get('machine'),site:f.get('site'),phone:'',issue:f.get('issue'),urgent:!!f.get('urgent'),status:'new',hours:f.get('hours')||'',photos:[],notes:'',parts:'',labor:'',travel:'',signature:false,approved:false,coord:'',created:fmt(new Date())};db.tickets.unshift(t);focusTicket=t.id;log('הלקוח פתח קריאה #'+t.id);note('קריאה #'+t.id+' נפתחה ונשלחה למנהל.','success');save()}function customerConfirm(id,yes){let t=ticket(id);if(!t||t.status!=='proposed')return;if(yes){t.status='scheduled';t.approved=true;log('הלקוח אישר ביקור לקריאה #'+id);note('הביקור אושר.','success')}else{t.status='new';db.bookings=db.bookings.filter(b=>b.ticket!==id);log('הלקוח ביקש שינוי מועד לקריאה #'+id);note('בקשת שינוי המועד נשלחה למנהל.','success')}save()}function manager(){const active=db.tickets.filter(t=>!['closed','billing'].includes(t.status));return '<div class="grid"><div class="card stat">קריאות פתוחות<strong>'+active.length+'</strong></div><div class="card stat">ממתינות לשיבוץ<strong>'+db.tickets.filter(t=>t.status==='new').length+'</strong></div><div class="card stat">ביקורים ביומן<strong>'+db.bookings.length+'</strong></div><div class="card stat">ממתינות לדוח<strong>'+db.tickets.filter(t=>['done','review'].includes(t.status)).length+'</strong></div></div><div class="section"><div><div class="card"><h2>📅 יומן שיבוצים משותף</h2>'+calendar()+'</div><div class="card"><h2>שיבוץ קריאת שירות</h2><form onsubmit="assign(event)"><div class="two"><div><label>קריאה</label><select name="ticket" required>'+db.tickets.filter(t=>!['billing','closed'].includes(t.status)).map(t=>'<option value="'+t.id+'" '+(focusTicket===t.id?'selected':'')+'>#'+t.id+' — '+esc(t.machine)+'</option>').join('')+'</select></div><div><label>טכנאי</label><select name="tech"><option value="1">טכנאי 1 (כחול)</option><option value="2">טכנאי 2 (סגול)</option></select></div></div><div class="two"><div><label>תאריך</label><input name="date" type="date" value="'+selected+'" required></div><div><label>שעת התחלה</label><input name="start" type="time" value="08:00" required></div></div><div class="two"><div><label>שעת סיום</label><input name="end" type="time" value="16:00" required></div><div><label>אופן תיאום</label><select name="coord"><option value="phone">תואם טלפונית</option><option value="portal">ממתין לאישור לקוח במערכת</option></select></div></div><label><input name="allDay" type="checkbox" style="width:auto"> יום עבודה מלא (08:00–17:00)</label><button class="btn">בדיקה ושמירת שיבוץ</button><p class="filehint">ימי עבודה רגילים: ראשון–חמישי. שישי ושבת חסומים. חגי ישראל והיעדרויות יתחברו בשלב הבא.</p></form></div></div><div><div class="card"><h2>קריאות שירות</h2>'+ticketList(db.tickets)+'</div>'+ticketDetail(ticket(focusTicket)||db.tickets[0],'manager')+'<div class="card"><h3>יומן פעולות</h3>'+(db.log.slice(0,6).map(l=>'<div class="item small">'+esc(l.time)+' — '+esc(l.text)+'</div>').join('')||'<p class="muted">עדיין אין פעולות.</p>')+'</div></div></div>'}function calendar(){let y=month.getFullYear(),m=month.getMonth(),n=new Date(y,m+1,0).getDate(),offset=new Date(y,m,1).getDay();let out='<div class="row"><button class="btn alt" onclick="changeMonth(-1)">❯ הקודם</button><b>'+new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}).format(month)+'</b><button class="btn alt" onclick="changeMonth(1)">הבא ❮</button></div><label>תצוגה</label><select onchange="filter=this.value;render()"><option value="all" '+(filter==='all'?'selected':'')+'>שני הטכנאים</option><option value="1" '+(filter==='1'?'selected':'')+'>טכנאי 1</option><option value="2" '+(filter==='2'?'selected':'')+'>טכנאי 2</option></select><div class="calendar">';['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'].forEach(d=>out+='<div class="weekday">'+d+'</div>');for(let i=0;i<offset;i++)out+='<div class="day empty"></div>';for(let d=1;d<=n;d++){let dt=fmt(new Date(y,m,d)),wd=new Date(y,m,d).getDay(),off=wd===5||wd===6,arr=db.bookings.filter(b=>b.date===dt);out+='<div class="day '+(off?'off ':'')+(dt===selected?'selected':'')+'" onclick="selectDate(\''+dt+'\')"><b>'+d+'</b><div class="bars">';for(let tech of [1,2])if(filter==='all'||filter===String(tech)){let bs=arr.filter(b=>b.tech===tech);out+='<div class="bar '+(bs.length?'tech'+tech:'')+'" style="'+(!bs.length?'background:#dce5e9':'')+'" title="טכנאי '+tech+': '+(bs.length?bs.length+' עבודות':'פנוי')+'"></div>'}out+='</div></div>'}out+='</div><div class="legend"><span style="--c:#3284b9">טכנאי 1</span><span style="--c:#a568bb">טכנאי 2</span><span style="--c:#dce5e9">פנוי</span></div><h3 style="margin-top:18px">'+selected+' — שיבוצים</h3>';let bs=db.bookings.filter(b=>b.date===selected&&(filter==='all'||String(b.tech)===filter));out+=bs.length?bs.map(b=>'<div class="item"><b>טכנאי '+b.tech+' · '+b.start+'–'+b.end+'</b><div>'+esc(b.title)+'</div>'+(b.ticket?'<span class="small">קריאה #'+b.ticket+'</span>':'')+' <button class="btn alt" onclick="removeBooking('+b.id+')">ביטול שיבוץ</button></div>').join(''):'<p class="muted">אין שיבוצים ליום זה.</p>';return out}function changeMonth(delta){month=new Date(month.getFullYear(),month.getMonth()+delta,1);selected=fmt(month);render()}function selectDate(d){selected=d;render()}function assign(e){e.preventDefault();const f=new FormData(e.target),id=Number(f.get('ticket')),tech=Number(f.get('tech')),date=f.get('date');let start=f.get('allDay')?'08:00':f.get('start'),end=f.get('allDay')?'17:00':f.get('end');const wd=new Date(date+'T12:00:00').getDay();if(wd===5||wd===6){note('לא ניתן לשבץ ביום שישי או שבת במסגרת ימי העבודה הרגילים.','error');render();return}if(end<=start){note('שעת הסיום חייבת להיות אחרי שעת ההתחלה.','error');render();return}if(db.bookings.some(b=>b.date===date&&b.tech===tech&&start<b.end&&end>b.start&&b.ticket!==id)){note('התנגשות ביומן: הטכנאי כבר משובץ לשעות האלו.','error');render();return}const t=ticket(id);if(!t)return;db.bookings=db.bookings.filter(b=>b.ticket!==id);db.bookings.push({id:Date.now(),ticket:id,tech,date,start,end,allDay:!!f.get('allDay'),title:t.customer+' — '+t.machine});t.coord=f.get('coord');t.status=t.coord==='phone'?'scheduled':'proposed';t.approved=t.coord==='phone';selected=date;month=new Date(date+'T12:00:00');log('המנהל שיבץ את קריאה #'+id+' לטכנאי '+tech+' ביום '+date+' ('+(t.coord==='phone'?'תואם טלפונית':'ממתין לאישור לקוח')+')');note('השיבוץ נשמר ביומן. '+(t.coord==='phone'?'תואם טלפונית ונחשב מאושר.':'הלקוח צריך לאשר באזור האישי.'),'success');save()}function removeBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;if(b.ticket){let t=ticket(b.ticket);if(t){t.status='new';t.approved=false}}db.bookings=db.bookings.filter(x=>x.id!==id);log('שיבוץ בוטל ביומן');note('השיבוץ בוטל; הקריאה חזרה לתיאום.','success');save()}
function ticketDetail(t,forRole){if(!t)return '';let b=booking(t.id);let html='<div class="card"><h2>פרטי קריאה #'+t.id+'</h2><p>'+pill(t.status)+'</p><p><b>'+esc(t.machine)+'</b> · '+esc(t.customer)+'</p><p class="muted small">אתר: '+esc(t.site)+' · שעות מנוע: '+esc(t.hours||'לא דווח')+'</p><p>'+esc(t.issue)+'</p>'+(b?'<div class="notice">📅 '+b.date+' · '+b.start+'–'+b.end+' · טכנאי '+b.tech+'<br>'+esc(t.coord==='phone'?'תואם טלפונית':t.approved?'אושר על ידי הלקוח':'ממתין לאישור לקוח')+'</div>':'<div class="notice">טרם נקבע ביקור</div>');if(forRole==='customer'&&t.status==='proposed')html+='<div class="actions"><button class="btn" onclick="customerConfirm('+t.id+',true)">אישור ביקור</button><button class="btn alt" onclick="customerConfirm('+t.id+',false)">בקשת שינוי</button></div>';if(t.notes)html+='<p><b>עבודה:</b> '+esc(t.notes)+'</p>';if(t.parts)html+='<p><b>חלפים:</b> '+esc(t.parts)+'</p>';if(t.photos.length)html+='<p><b>תיעוד:</b> '+t.photos.map(p=>esc(p)).join(', ')+'</p>';if(forRole==='manager'&&['done','review','billing'].includes(t.status))html+='<p class="small">שעות עבודה: '+esc(t.labor)+' · נסיעה: '+esc(t.travel)+' · חתימה: '+(t.signature?'קיימת':'חסרה')+'</p>';html+='</div>';return html}function tech(){const booked=db.bookings.filter(b=>b.ticket>0);let selectedTicket=ticket(focusTicket);if(!selectedTicket||!booked.some(b=>b.ticket===selectedTicket.id)){selectedTicket=ticket(booked[0]?.ticket)}return '<div class="grid"><div class="card stat">משימות משובצות<strong>'+booked.length+'</strong></div><div class="card stat">בטיפול<strong>'+db.tickets.filter(t=>['working','onsite','onway'].includes(t.status)).length+'</strong></div><div class="card stat">ממתינות לחלפים<strong>'+db.tickets.filter(t=>t.status==='parts').length+'</strong></div><div class="card stat">הושלמו<strong>'+db.tickets.filter(t=>['done','review','billing'].includes(t.status)).length+'</strong></div></div><div class="section"><div><div class="card"><h2>משימות הטכנאים — הדגמה</h2><p class="muted small">בגרסה אמיתית כל טכנאי יראה רק את המשימות שהוקצו לו.</p>'+booked.map(b=>{let t=ticket(b.ticket);return '<div class="item"><div class="row"><b>#'+t.id+' · '+esc(t.machine)+'</b>'+pill(t.status)+'</div><div class="small muted">טכנאי '+b.tech+' · '+b.date+' · '+b.start+'–'+b.end+'</div><p>'+esc(t.issue)+'</p><button class="btn alt" onclick="focusTicket='+t.id+';render()">פתיחת משימה</button></div>'}).join('')+'</div></div><div>'+(selectedTicket?'<div class="card"><h2>עדכון עבודה #'+selectedTicket.id+'</h2><p>'+esc(selectedTicket.machine)+' · '+esc(selectedTicket.site)+'</p><div class="actions">'+[['onway','בדרך'],['onsite','הגעתי לאתר'],['working','בטיפול'],['parts','ממתין לחלפים'],['done','העבודה הושלמה']].map(([s,l])=>'<button class="btn '+(s==='parts'?'alt':'')+'" onclick="setStatus('+selectedTicket.id+',\''+s+'\')">'+l+'</button>').join('')+'</div><form onsubmit="saveReport(event,'+selectedTicket.id+')"><label>פירוט העבודה שבוצעה</label><textarea name="notes" placeholder="מה נמצא ומה בוצע?">'+esc(selectedTicket.notes)+'</textarea><label>חלפים שהוחלפו / נדרשים</label><textarea name="parts" placeholder="שם חלק, מק״ט, כמות">'+esc(selectedTicket.parts)+'</textarea><div class="two"><div><label>שעות עבודה</label><input type="number" name="labor" step="0.25" min="0" value="'+esc(selectedTicket.labor)+'"></div><div><label>שעות נסיעה</label><input type="number" name="travel" step="0.25" min="0" value="'+esc(selectedTicket.travel)+'"></div></div><label>שעות מנוע</label><input type="number" name="hours" min="0" value="'+esc(selectedTicket.hours)+'"><label>תמונות תיעוד (בחירת קבצים)</label><input type="file" name="photos" accept="image/*" multiple><p class="filehint">באבטיפוס נשמרים שמות הקבצים בלבד; אין העלאת תמונות לשרת.</p><label><input type="checkbox" name="signature" style="width:auto" '+(selectedTicket.signature?'checked':'')+'> נציג הלקוח חתם (סימון הדגמה בלבד)</label><button class="btn">שמירת דוח עבודה</button></form></div>':'<div class="card"><h2>אין משימה משובצת</h2><p>כדי להדגים עבודת טכנאי, עבור למנהל ושבץ קריאה ביומן.</p></div>')+'</div></div>'}function setStatus(id,s){let t=ticket(id);if(!t)return;t.status=s;log('הטכנאי עדכן קריאה #'+id+': '+statuses[s]);note('סטטוס הקריאה עודכן.','success');save()}function saveReport(e,id){e.preventDefault();let t=ticket(id),f=new FormData(e.target);for(let k of ['notes','parts','labor','travel','hours'])t[k]=f.get(k);t.signature=!!f.get('signature');let files=e.target.querySelector('[name=photos]').files;t.photos=[...new Set([...t.photos,...[...files].map(x=>x.name)])];if(t.status==='done')t.status='review';log('הטכנאי שמר דוח עבודה לקריאה #'+id);note('דוח העבודה נשמר בהדגמה.','success');save()}function office(){return '<div class="grid"><div class="card stat">קריאות חדשות<strong>'+db.tickets.filter(t=>t.status==='new').length+'</strong></div><div class="card stat">ממתינות לאישור<strong>'+db.tickets.filter(t=>t.status==='proposed').length+'</strong></div><div class="card stat">דוחות לבדיקה<strong>'+db.tickets.filter(t=>['done','review'].includes(t.status)).length+'</strong></div><div class="card stat">מוכנות לחיוב<strong>'+db.tickets.filter(t=>t.status==='billing').length+'</strong></div></div><div class="section"><div><div class="card"><h2>קריאות שירות ומעקב</h2>'+ticketList(db.tickets)+'</div><div class="card"><h2>דוחות להשלמה ולחיוב</h2>'+db.tickets.filter(t=>['done','review','billing'].includes(t.status)).map(t=>'<div class="item"><div class="row"><b>#'+t.id+' · '+esc(t.machine)+'</b>'+pill(t.status)+'</div><p class="small">פירוט: '+(t.notes?'✓':'חסר')+' · שעות עבודה: '+(t.labor?'✓':'חסר')+' · חתימה: '+(t.signature?'✓':'חסרה')+'</p><button class="btn" '+(!t.notes||!t.labor||!t.signature||t.status==='billing'?'disabled':'')+' onclick="markBilling('+t.id+')">סימון כמוכן לחיוב</button></div>').join('')+'</div></div><div><div class="card"><h2>פתיחת קריאה טלפונית</h2><form onsubmit="createTicket(event)"><label>לקוח</label><select name="customer"><option>מחצבות השרון (דוגמה)</option><option>תשתיות המרכז (דוגמה)</option></select><label>מכונה</label><select name="machine"><option>Keestrack P3</option><option>Powerscreen 1400</option><option>McCloskey S190</option></select><label>אתר עבודה</label><input name="site" value="אתר השרון" required><label>תיאור התקלה</label><textarea name="issue" required></textarea><label><input type="checkbox" name="urgent" style="width:auto"> מכונה מושבתת</label><input name="hours" type="number" placeholder="שעות מנוע"><div class="actions"><button class="btn">פתיחת קריאה</button></div></form></div>'+ticketDetail(ticket(focusTicket)||db.tickets[0],'office')+'<div class="card"><h3>יומן השיבוצים — צפייה</h3><p>היומן המלא נמצא באזור המנהל. המזכירות יכולה לראות את התיאומים דרך פרטי הקריאות; תצוגת יומן עצמאית למזכירות תתווסף באיטרציה הבאה.</p></div></div></div>'}function markBilling(id){let t=ticket(id);if(!t.notes||!t.labor||!t.signature)return;t.status='billing';log('המזכירות סימנה קריאה #'+id+' כמוכנה לחיוב');note('הדוח סומן כמוכן לחיוב.','success');save()}function resetDemo(){if(!confirm('לאפס את כל נתוני ההדגמה בדפדפן זה?'))return;localStorage.removeItem(KEY);location.reload()}window.addEventListener('error',e=>console.error(e.message));render();
</script><div style="text-align:center;padding:0 0 25px"><button class="btn alt" onclick="resetDemo()">איפוס נתוני ההדגמה</button></div></body></html>
