function setupWorkspace(){
 const app=$('app');const stats=app.querySelector(':scope > .grid');const section=app.querySelector(':scope > .section');if(!section)return;

 };

 const panel=document.createElement('section');panel.className='workspace-panel';panel.dataset.tab=k;panel.hidden=currentTab!==k;if(k==='overview'){if(stats)panel.append(stats);const summary=document.createElement('div');summary.className='card quickstart';summary.innerHTML='<h2>מה תרצו לעשות היום?</h2><p class="muted">בחרו פעולה מהתפריט. כל הנתונים נשמרים בדפדפן הזה בלבד.</p>';const actions=document.createElement('div');actions.className='quick-actions';available.filter(x=>x!=='overview').forEach(x=>{const btn=document.createElement('button');btn.className='btn alt';btn.textContent=labels[x][1]+' ←';btn.onclick=()=>{currentTab=x;updateWorkspace()};actions.append(btn)});summary.append(actions);panel.append(summary)}else tabs[k].forEach(c=>panel.append(c));panels.append(panel)});

function photoSection(t){return (t.media&&t.media.length?'<div class="preview-grid">'+imgMarkup(t)+'</div>':'')+(t.media&&t.media.some(m=>m.type==='video')?'<p class="small">🎥 צורף סרטון; קבצי וידאו אינם נשמרים מקומית בגרסה זו.</p>':'')}
ticketDetail=function(t,r){let html=origDetail(t,r);if(!t)return html;return html.replace('</div>', '</div>')+'<div class="enhance"><h2>📷 תיעוד ומיקום</h2>'+mapControls(t)+photoSection(t)+(t.triage?'<h3>בדיקות הלקוח</h3><p>'+esc(t.triage)+'</p>':'')+(t.ready?'<p>✓ הלקוח אישר מוכנות אתר</p>':'')+(r==='manager'||r==='office'?'<div class="mail-row"><button class="btn alt" onclick="mailTicket('+t.id+')">✉️ הכנת מייל</button><button class="btn alt" onclick="printTicket('+t.id+')">🖨️ דוח להדפסה / PDF</button></div>':'')+'</div>'}
function triagePanel(){return '<div class="enhance"><h2>🔍 בדיקה ראשונית לפני הזמנת טכנאי</h2><p class="small">בדיקות חיצוניות בלבד, כשהמכונה כבויה ומאובטחת לפי נהלי האתר והוראות היצרן. אין לפתוח מגנים, לשחרר חסימות או לגעת בחשמל או בצנרת הידראולית בלחץ.</p><label>מה הבעיה?</label><select id="triage-fault" onchange="showTriage()"><option value="start">המכונה לא מניעה</option><option value="conveyor">מסוע או נפה לא פועלים</option><option value="warning">התראה בלוח הבקרה</option><option value="leak">חשד לנזילה</option></select><div id="triage-checks"></div><p class="small">אפשר לסמן שהבעיה נפתרה, או לצרף את תוצאות הבדיקות לקריאת שירות.</p><button type="button" class="btn alt" onclick="resolvedRemote()">✓ הבעיה נפתרה — ללא טכנאי</button></div>'}
const checksByFault={start:['האם מד הדלק מראה שיש סולר?','האם מופיעה הודעת תקלה בלוח הבקרה?','האם יש סימן למצבר חלש בלוח המחוונים?','האם נבדקו מפלסים לפי הוראות הדגם, בתנאים בטוחים?'],conveyor:['האם מופיעה התראה או קוד תקלה?','האם התקלה הופיעה בזמן עומס?','האם אפשר לתעד את המצב מרחוק ללא גישה לחלקים נעים?'],warning:['האם צילמתם את קוד התקלה?','האם רשמתם את שעות המנוע?','האם תיעדתם מה קרה לפני ההתראה?'],leak:['האם זיהיתם את האזור ממרחק בטוח?','האם המכונה הושבתה והאזור הורחק מאנשים?','האם צילמתם מרחוק בלי להתקרב לנוזל או לקו לחץ?']};
function showTriage(){let f=$('triage-fault'),c=$('triage-checks');if(!f||!c)return;c.innerHTML=checksByFault[f.value].map((x,i)=>'<label class="checkline"><input type="checkbox" class="triage-check" data-label="'+esc(x)+'">'+esc(x)+'</label>').join('')}
function triageText(){let f=$('triage-fault');if(!f)return '';let labels={start:'מכונה לא מניעה',conveyor:'מסוע / נפה',warning:'התראה',leak:'נזילה'};return labels[f.value]+': '+[...document.querySelectorAll('.triage-check')].map(x=>(x.checked?'בוצע: ':'טרם בוצע: ')+x.dataset.label).join(' | ')}
function resolvedRemote(){let text=triageText();db.remoteResolved=(db.remoteResolved||0)+1;origLog('דיווח לקוח: תקלה נפתרה ללא הגעת טכנאי. '+text);note('הדיווח נשמר. לא נפתחה קריאת שירות.','success');save()}
function customerExtras(){return triagePanel()+'<div class="enhance"><h2>📷 תמונות ומיקום לקריאה</h2><p class="small">לפני שליחת הקריאה: צלמו את התקלה, לוח הבקרה או המספר הסידורי. תמונות יוקטנו ויישמרו בדפדפן זה בלבד.</p><label>תמונות מהמצלמה / גלריה</label><input id="client-media" type="file" accept="image/*" multiple onchange="previewClientFiles(this)"><div id="client-preview" class="preview-grid"></div><label>מיקום המכונה</label><div class="btnline"><button type="button" class="btn alt" onclick="captureGPS()">📍 השתמש במיקום הנוכחי</button><button type="button" class="btn alt" onclick="clearGPS()">נקה מיקום</button></div><p id="gps-result" class="small">ניתן גם להזין כתובת אתר בטופס. GPS מחייב אישור מיקום.</p><label>קישור למיקום המכונה (לא חובה)</label><input id="client-maplink" type="url" placeholder="https://maps.google.com/..."><label class="checkline"><input id="site-ready" type="checkbox">יש נציג באתר והמכונה נגישה לביקור</label></div>'}
let capturedGPS=null;function captureGPS(){if(!navigator.geolocation){$('gps-result').textContent='המכשיר אינו תומך ב-GPS';return}navigator.geolocation.getCurrentPosition(p=>{capturedGPS={lat:p.coords.latitude,lng:p.coords.longitude};$('gps-result').textContent='✓ המיקום נקלט. ודאו שאתם ליד המכונה ולא במשרד.'},e=>{$('gps-result').textContent='לא התקבל מיקום. אפשר להזין כתובת או קישור למפות.'},{enableHighAccuracy:true,timeout:12000})}
function clearGPS(){capturedGPS=null;if($('gps-result'))$('gps-result').textContent='המיקום נוקה'}
function previewClientFiles(input){let box=$('client-preview');if(!box)return;box.innerHTML='';[...input.files].slice(0,4).forEach(f=>{if(f.type.startsWith('image/')){let img=document.createElement('img');img.src=URL.createObjectURL(f);img.alt='תצוגת תמונה';box.append(img)}})}
function compressImage(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return resolve(null);const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,900/Math.max(w,h));let cv=document.createElement('canvas');cv.width=Math.round(w*scale);cv.height=Math.round(h*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);resolve({type:'image',name:file.name,data:cv.toDataURL('image/jpeg',.58)})};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
async function readImages(files){let out=[];for(let f of [...files].slice(0,3)){try{let p=await compressImage(f);if(p)out.push(p)}catch(e){}}return out}
function safePersist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){return false}}
createTicket=async function(e){e.preventDefault();let form=e.target,f=new FormData(form),client=activeUser.role==='customer';let media=client&&$('client-media')?await readImages($('client-media').files):[];let t={id:db.nextId++,customer:client?techCustomer:f.get('customer'),machine:f.get('machine'),site:f.get('site'),phone:'',issue:f.get('issue'),urgent:!!f.get('urgent'),status:'new',hours:f.get('hours')||'',photos:[],media,notes:'',parts:'',labor:'',travel:'',signature:false,approved:false,coord:'',created:fmt(new Date()),triage:client?triageText():'',ready:client&&!!$('site-ready')?.checked,lat:client?capturedGPS?.lat:null,lng:client?capturedGPS?.lng:null,mapLink:client?$('client-maplink')?.value:''};db.tickets.unshift(t);focusTicket=t.id;origLog('נפתחה קריאת שירות #'+t.id+' — '+t.machine);if(!safePersist()){t.media=[];safePersist();note('הקריאה נשמרה, אך התמונות היו גדולות מדי לאחסון המקומי.','error')}else note('קריאה #'+t.id+' נפתחה ונשלחה למנהל ולמזכירות.','success');capturedGPS=null;render()}
saveReport=async function(e,id){e.preventDefault();if(activeUser?.role!=='tech'||!db.bookings.some(b=>b.ticket===id&&b.tech===Number(activeUser.id.replace('tech',''))))return;let t=ticket(id),f=new FormData(e.target);for(let k of ['notes','parts','labor','travel','hours'])t[k]=f.get(k);t.signature=!!f.get('signature');let files=e.target.querySelector('[name=photos]').files;let media=await readImages(files);t.media=[...(t.media||[]),...media].slice(-6);t.photos=[...new Set([...(t.photos||[]),...[...files].map(x=>x.name)])];if(t.status==='done')t.status='review';origLog('דוח טכנאי נשמר לקריאה #'+id);if(!safePersist()){t.media=[];safePersist();note('דוח נשמר ללא תמונות בגלל מגבלת אחסון.','error')}else note('דוח העבודה והתמונות נשמרו בדפדפן.','success');render()}
function roleNotices(){let who=activeUser?.role,techid=Number(activeUser?.id?.replace('tech',''));let out=[];for(let t of db.tickets){if(who==='manager'||who==='office'){if(t.status==='new')out.push({id:t.id,text:'קריאה חדשה #'+t.id+' · '+t.machine});if(['done','review'].includes(t.status))out.push({id:t.id,text:'דוח טכנאי ממתין לבדיקה #'+t.id})}if(who==='tech'&&db.bookings.some(b=>b.ticket===t.id&&b.tech===techid)&&['scheduled','onway','onsite','working'].includes(t.status))out.push({id:t.id,text:'משימה משובצת #'+t.id+' · '+t.machine});if(who==='customer'&&t.customer===techCustomer&&t.status==='proposed')out.push({id:t.id,text:'מועד ביקור ממתין לאישור #'+t.id});if(who==='customer'&&t.customer===techCustomer&&t.hours&&Number(t.hours)>0){let next=Math.ceil((Number(t.hours)+1)/500)*500;if(next-Number(t.hours)<=50)out.push({id:t.id,text:'בדקו תוכנית טיפול: '+t.machine+' · '+(next-Number(t.hours))+' שעות עד סף הדגמה'} )}}return out.slice(0,15)}
let bellOpen=false;function toggleBell(){bellOpen=!bellOpen;renderBell()}
function renderBell(){let nav=$('nav');if(!nav||!activeUser)return;nav.querySelector('.notice-center')?.remove();let list=roleNotices(),read=JSON.parse(sessionStorage.getItem('ofek_read_'+activeUser.id)||'[]'),unread=list.filter(n=>!read.includes(n.text));let el=document.createElement('div');el.className='notice-center';el.innerHTML='<button class="bell-btn" onclick="toggleBell()" aria-label="התראות">🔔 '+(unread.length?'<span class="bell-count">'+unread.length+'</span>':'')+'</button>'+(bellOpen?'<div class="notice-panel"><b>התראות</b><button class="btn alt" style="margin:7px" onclick="readAllNotices()">סמן הכול כנקרא</button>'+(list.length?list.map(n=>'<div class="notice-item"><span class="statusdot"></span>'+esc(n.text)+'<small>נתוני הדגמה בדפדפן זה</small></div>').join(''):'<p>אין התראות חדשות</p>')+'</div>':'');nav.prepend(el)}
function readAllNotices(){sessionStorage.setItem('ofek_read_'+activeUser.id,JSON.stringify(roleNotices().map(x=>x.text)));bellOpen=false;renderBell()}
function mailTicket(id){let t=ticket(id);if(!t)return;let subject='אופק שירות ותחזוקה | קריאת שירות #'+id;let body='שלום,\n\nעדכון לגבי קריאת שירות #'+id+'\nמכונה: '+t.machine+'\nאתר: '+t.site+'\nסטטוס: '+(statuses[t.status]||t.status)+'\n\nבברכה,\nאופק שירות ותחזוקה';window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function printTicket(id){let t=ticket(id);if(!t)return;let w=window.open('','_blank');if(!w){alert('אפשרו חלונות קופצים להדפסת הדוח');return}w.document.write('<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><title>דוח אופק #'+id+'</title><style>body{font:16px Arial;padding:35px;line-height:1.8}h1{color:#12616a}img{max-width:180px;margin:8px}</style><h1>אופק שירות ותחזוקה — דוח שירות</h1><p>קריאה #'+id+' · '+esc(t.customer)+'</p><p>מכונה: '+esc(t.machine)+'</p><p>אתר: '+esc(t.site)+'</p><p>תקלה: '+esc(t.issue)+'</p><p>עבודה: '+esc(t.notes)+'</p><p>חלפים: '+esc(t.parts)+'</p><p>שעות עבודה: '+esc(t.labor)+' | נסיעה: '+esc(t.travel)+'</p><p>חתימה: '+(t.signature?'אושרה בהדגמה':'לא קיימת')+'</p>'+imgMarkup(t)+'<p><small>מסמך הדגמה; אינו חשבונית או אישור חתימה משפטי</small></p><script>window.onload=function(){window.print()}<\/script></html>');w.document.close()}
function managerExtras(){return '<div class="enhance"><h2>📊 מדדי שירות</h2><p>קריאות שטופלו מרחוק ללא יציאת טכנאי: <b>'+(db.remoteResolved||0)+'</b></p><p class="small">אין חישוב חיסכון כספי ללא נתוני נסיעות מאומתים.</p><h3>תקשורת עם הלקוח</h3><button class="btn alt" onclick="mailTicket('+focusTicket+')">✉️ הכנת מייל לקריאה נבחרת</button><button class="btn alt" onclick="printTicket('+focusTicket+')">🖨️ הפקת דוח להדפסה / PDF</button></div>'}
function officeExtras(){return '<div class="enhance"><h2>✉️ מרכז תקשורת</h2><p>אפשר להכין הודעת מייל עם פרטי הקריאה ולשלוח מאפליקציית המייל.</p><button class="btn alt" onclick="mailTicket('+focusTicket+')">הכנת מייל ללקוח</button><button class="btn alt" onclick="printTicket('+focusTicket+')">הפקת דוח שירות PDF דרך הדפסה</button><p class="small">השליחה אינה אוטומטית; המייל נפתח ללא נמען עד להזנת כתובת מאומתת.</p></div>'}
function machineGuide(){return '<div class="enhance"><h2>📚 מרכז ידע למפעיל</h2><p class="small">בדיקות בסיסיות בלבד. ספרי יצרן רשמיים לפי דגם יתווספו לאחר קבלתם ואימותם.</p><details><summary>בדיקה יומית בסיסית</summary><p>לפני תחילת עבודה, לפי ספר היצרן: בדיקת דלק, התראות, נזילות חיצוניות, מפלסי שמן ונוזל קירור בתנאים בטוחים.</p></details><details><summary>מכונה לא מניעה</summary><p>בדקו את מד הדלק ואת התראות לוח הבקרה. תעדו סימני מצבר חלש. אל תעקפו מנגנוני בטיחות.</p></details><details><summary>תקלה במסוע או במערכת הידראולית</summary><p>הפסיקו עבודה לפי הנהלים. צלמו מרחוק את ההתראה ותארו את התקלה. אין לגשת לחלקים נעים, לפתוח מגנים או לגעת בקווי לחץ.</p></details></div>'}
function injectRoleExtras(){if(!activeUser)return;let root=$('app');if(!root)return;let target=root.querySelector('.section');if(!target)return;if(role==='customer'){let form=root.querySelector('form[onsubmit="createTicket(event)"]');if(form){let host=document.createElement('div');host.innerHTML=customerExtras();form.parentNode.insertBefore(host,form);let tr=document.createElement('div');tr.innerHTML=triagePanel();form.parentNode.insertBefore(tr,host);let guide=document.createElement('div');guide.innerHTML=machineGuide();form.parentNode.append(guide);showTriage()}}if(role==='manager'||role==='office'){let el=document.createElement('div');el.innerHTML=role==='manager'?managerExtras():officeExtras();target.append(el)}if(role==='tech'){let form=root.querySelector('form[onsubmit^="saveReport"]');if(form){let box=document.createElement('div');box.className='helpbox';box.textContent='תמונות יוקטנו ויישמרו בדפדפן בלבד. חתימה היא סימון הדגמה ולא חתימה דיגיטלית מאומתת.';form.prepend(box)}}}
render=function(){origRender();if(activeUser){renderBell();injectRoleExtras();document.querySelectorAll('.item b').forEach(b=>{let s=b.textContent;if(/Keestrack|Powerscreen|McCloskey/i.test(s))b.classList.add('machinetag',vendorClass(s))})}}

window.addEventListener('error',e=>console.error(e.message));render();
</script><div style="text-align:center;padding:0 0 25px"><button class="btn alt" onclick="resetDemo()">איפוס נתוני ההדגמה</button></div></body></html>
