function triagePanel(){return '<div class="enhance"><h2>🔍 בדיקה ראשונית לפני הזמנת טכנאי</h2><p class="small">בדיקות חיצוניות בלבד, כשהמכונה כבויה ומאובטחת לפי נהלי האתר והוראות היצרן. אין לפתוח מגנים, לשחרר חסימות או לגעת בחשמל או בצנרת הידראולית בלחץ.</p><label>מה הבעיה?</label><select id="triage-fault" onchange="showTriage()"><option value="start">המכונה לא מניעה</option><option value="conveyor">מסוע או נפה לא פועלים</option><option value="warning">התראה בלוח הבקרה</option><option value="leak">חשד לנזילה</option></select><div id="triage-checks"></div><p class="small">אפשר לסמן שהבעיה נפתרה, או לצרף את תוצאות הבדיקות לקריאת שירות.</p><button type="button" class="btn alt" onclick="resolvedRemote()">✓ הבעיה נפתרה — ללא טכנאי</button></div>'}

function showTriage(){let f=$('triage-fault'),c=$('triage-checks');if(!f||!c)return;c.innerHTML=checksByFault[f.value].map((x,i)=>'<label class="checkline"><input type="checkbox" class="triage-check" data-label="'+esc(x)+'">'+esc(x)+'</label>').join('')}

function customerExtras(){return '<div class="enhance"><h2>📷 תמונות ומיקום לקריאה</h2><p class="small">לפני שליחת הקריאה: צלמו את התקלה, לוח הבקרה או המספר הסידורי. תמונות יוקטנו ויישמרו בדפדפן זה בלבד.</p><label>תמונות מהמצלמה / גלריה</label><input id="client-media" type="file" accept="image/*" multiple onchange="previewClientFiles(this)"><div id="client-preview" class="preview-grid"></div><label>מיקום המכונה</label><div class="btnline"><button type="button" class="btn alt" onclick="captureGPS()">📍 השתמש במיקום הנוכחי</button><button type="button" class="btn alt" onclick="clearGPS()">נקה מיקום</button></div><p id="gps-result" class="small">ניתן גם להזין כתובת אתר בטופס. GPS מחייב אישור מיקום.</p><label>קישור למיקום המכונה (לא חובה)</label><input id="client-maplink" type="url" placeholder="https://maps.google.com/..."><label class="checkline"><input id="site-ready" type="checkbox">יש נציג באתר והמכונה נגישה לביקור</label></div>'}
let capturedGPS=null;function captureGPS(){if(!navigator.geolocation){$('gps-result').textContent='המכשיר אינו תומך ב-GPS';return}navigator.geolocation.getCurrentPosition(p=>{capturedGPS={lat:p.coords.latitude,lng:p.coords.longitude};$('gps-result').textContent='✓ המיקום נקלט. ודאו שאתם ליד המכונה ולא במשרד.'},e=>{$('gps-result').textContent='לא התקבל מיקום. אפשר להזין כתובת או קישור למפות.'},{enableHighAccuracy:true,timeout:12000})}

function previewClientFiles(input){let box=$('client-preview');if(!box)return;box.innerHTML='';[...input.files].slice(0,4).forEach(f=>{if(f.type.startsWith('image/')){let img=document.createElement('img');img.src=URL.createObjectURL(f);img.alt='תצוגת תמונה';box.append(img)}})}
function compressImage(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return resolve(null);const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,900/Math.max(w,h));let cv=document.createElement('canvas');cv.width=Math.round(w*scale);cv.height=Math.round(h*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);resolve({type:'image',name:file.name,data:cv.toDataURL('image/jpeg',.58)})};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
async function readImages(files){let out=[];for(let f of [...files].slice(0,3)){try{let p=await compressImage(f);if(p)out.push(p)}catch(e){}}return out}

createTicket=async function(e){e.preventDefault();let form=e.target,f=new FormData(form),client=activeUser.role==='customer';let media=client&&$('client-media')?await readImages($('client-media').files):[];let t={id:db.nextId++,customer:client?techCustomer:f.get('customer'),machine:f.get('machine'),site:f.get('site'),phone:'',issue:f.get('issue'),urgent:!!f.get('urgent'),status:'new',hours:f.get('hours')||'',photos:[],media,notes:'',parts:'',labor:'',travel:'',signature:false,approved:false,coord:'',created:fmt(new Date()),triage:client?triageText():'',ready:client&&!!$('site-ready')?.checked,lat:client?capturedGPS?.lat:null,lng:client?capturedGPS?.lng:null,mapLink:client?$('client-maplink')?.value:''};db.tickets.unshift(t);focusTicket=t.id;origLog('נפתחה קריאת שירות #'+t.id+' — '+t.machine);if(!safePersist()){t.media=[];if(safePersist())note('הקריאה נשמרה ללא תמונות בגלל מגבלת אחסון.','error');else{db.tickets=db.tickets.filter(x=>x!==t);db.nextId--;note('לא ניתן לשמור את הקריאה: האחסון המקומי מלא.','error')}}else note('קריאה #'+t.id+' נפתחה ונשמרה בהדגמה המקומית. מנהל ומזכירות יראו אותה באותו דפדפן.','success');capturedGPS=null;render()}
saveReport=async function(e,id){e.preventDefault();if(activeUser?.role!=='tech'||!db.bookings.some(b=>b.ticket===id&&b.tech===Number(activeUser.id.replace('tech',''))))return;let t=ticket(id),f=new FormData(e.target);for(let k of ['notes','parts','labor','travel','hours'])t[k]=f.get(k);t.signature=!!f.get('signature');let files=e.target.querySelector('[name=photos]').files;let media=await readImages(files);t.media=[...(t.media||[]),...media].slice(-6);t.photos=[...new Set([...(t.photos||[]),...[...files].map(x=>x.name)])];if(t.status==='done')t.status='review';origLog('דוח טכנאי נשמר לקריאה #'+id);if(!safePersist()){t.media=(t.media||[]).slice(0,-media.length);if(safePersist())note('הדוח נשמר ללא התמונות החדשות בגלל מגבלת אחסון.','error');else note('האחסון מלא; לא ניתן לשמור את הדוח.','error')}else note('דוח העבודה והתמונות נשמרו בדפדפן.','success');render()}
function roleNotices(){let who=activeUser?.role,techid=Number(activeUser?.id?.replace('tech',''));let out=[];for(let t of db.tickets){if(who==='manager'||who==='office'){if(t.status==='new')out.push({id:t.id,text:'קריאה חדשה #'+t.id+' · '+t.machine});if(['done','review'].includes(t.status))out.push({id:t.id,text:'דוח טכנאי ממתין לבדיקה #'+t.id})}if(who==='tech'&&db.bookings.some(b=>b.ticket===t.id&&b.tech===techid)&&['scheduled','onway','onsite','working'].includes(t.status))out.push({id:t.id,text:'משימה משובצת #'+t.id+' · '+t.machine});if(who==='customer'&&t.customer===techCustomer&&t.status==='proposed')out.push({id:t.id,text:'מועד ביקור ממתין לאישור #'+t.id});if(who==='customer'&&t.customer===techCustomer&&t.hours&&Number(t.hours)>0){let next=Math.ceil((Number(t.hours)+1)/500)*500;if(next-Number(t.hours)<=50)out.push({id:t.id,text:'בדקו תוכנית טיפול: '+t.machine+' · '+(next-Number(t.hours))+' שעות עד סף הדגמה'} )}}return out.slice(0,15)}
let bellOpen=false;function toggleBell(){bellOpen=!bellOpen;renderBell()}
function renderBell(){let nav=$('nav');if(!nav||!activeUser)return;nav.querySelector('.notice-center')?.remove();let list=roleNotices(),read=JSON.parse(sessionStorage.getItem('ofek_read_'+activeUser.id)||'[]'),unread=list.filter(n=>!read.includes(n.text));let el=document.createElement('div');el.className='notice-center';el.innerHTML='<button class="bell-btn" onclick="toggleBell()" aria-label="התראות">🔔 '+(unread.length?'<span class="bell-count">'+unread.length+'</span>':'')+'</button>'+(bellOpen?'<div class="notice-panel"><b>התראות</b><button class="btn alt" style="margin:7px" onclick="readAllNotices()">סמן הכול כנקרא</button>'+(list.length?list.map(n=>'<div class="notice-item"><span class="statusdot"></span>'+esc(n.text)+'<small>נתוני הדגמה בדפדפן זה</small></div>').join(''):'<p>אין התראות חדשות</p>')+'</div>':'');nav.prepend(el)}

 window.ofekExport=function(){
  const blob=new Blob([JSON.stringify({format:'ofek-demo-backup',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ofek-demo-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
 };
 window.ofekImport=async function(input){
  const file=input.files?.[0];if(!file)return;
  try{
   const obj=JSON.parse(await file.text());
   if(obj.format!=='ofek-demo-backup'||!obj.data||!Array.isArray(obj.data.tickets)||!Array.isArray(obj.data.bookings)||!Array.isArray(obj.data.log)||typeof obj.data.nextId!=='number')throw Error('invalid backup');
   if(!confirm('שחזור הגיבוי יחליף את נתוני ההדגמה בדפדפן הזה. להמשיך?'))return;
   const raw=JSON.stringify(obj.data);localStorage.setItem(KEY,raw);db=obj.data;focusTicket=db.tickets[0]?.id||0;currentTab='overview';note('הגיבוי שוחזר בהצלחה.','success');render();
  }catch(e){alert('לא ניתן לשחזר את הקובץ. ודאו שזה גיבוי תקין של אופק ושיש מספיק מקום בדפדפן.')}finally{input.value=''}
 };
 const previous=window.render;
 window.render=function(...args){
  const result=previous.apply(this,args);
  const nav=document.getElementById('nav');
  if(activeUser&&nav&&!nav.querySelector('.ofek-backup')){
   const tools=document.createElement('div');tools.className='ofek-backup';
   tools.innerHTML='<button type="button" class="btn alt" onclick="ofekExport()">⬇ גיבוי נתונים</button><label class="btn alt" style="cursor:pointer">⬆ שחזור גיבוי<input type="file" accept="application/json,.json" style="display:none" onchange="ofekImport(this)"></label>';
   nav.append(tools);
  }
  // Translate newly injected toolbar and feature cards without changing their original content.
  if(window.ofekTranslateNow)window.ofekTranslateNow();
  return result;
 };
})();
